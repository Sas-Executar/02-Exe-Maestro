        x-field-id: '2.6'
        x-example: 'Ex: Artigo real publicado ponta a ponta sem edição manual de TypeScript.'
        x-workbook-response-cell: 01_Formulario!E28
        x-output-sheet: 02_Visao_Geral
      '2.7':
