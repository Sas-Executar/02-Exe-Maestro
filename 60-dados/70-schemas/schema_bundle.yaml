$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:executa:saas-project-schema-bundle:v1
title: Projeto SaaS — Schema Bundle para extração documental
description: Schema consolidado derivado da aba 01_Formulario. Preserva 17 domínios e 94 IDs canônicos e exige proveniência
  para respostas extraídas de corpus documental.
type: object
additionalProperties: false
required:
- project
- domains
properties:
  project:
    type: object
    additionalProperties: false
    required:
    - project_name
    - corpus_id
    properties:
      project_name:
        type: string
        minLength: 1
      corpus_id:
        type: string
        minLength: 1
      corpus_version:
        type:
        - string
        - 'null'
      extraction_run_id:
        type:
        - string
        - 'null'
      generated_at:
        type:
        - string
        - 'null'
        format: date-time
      notes:
        type:
        - string
        - 'null'
  domains:
    type: object
    additionalProperties: false
    required:
    - domain_01_negocio_gtm
    - domain_02_produto
    - domain_03_arquitetura_full_stack
    - domain_04_implementacao
    - domain_05_operacao_deploy_rollback
    - domain_06_governanca_seguranca
    - domain_07_documentacao_fundacional
    - domain_08_gestao_de_projetos_pmbok
    - domain_09_planejamento_estrategico_tatico_e_operacional
    - domain_10_roadmap_cronograma_ciclos_e_backlog
    - domain_11_editorial_campanhas_e_conteudo
    - domain_12_stakeholders
    - domain_13_runbooks_sops_e_rotinas
    - domain_14_pesquisa_dados_e_conhecimento
    - domain_15_skills_plugins_e_ferramentas
    - domain_16_plataformas_contas_e_identificadores
    - domain_17_prompt_engineering_comandos
    properties:
      domain_01_negocio_gtm:
        $ref: '#/$defs/domain_01_negocio_gtm'
      domain_02_produto:
        $ref: '#/$defs/domain_02_produto'
      domain_03_arquitetura_full_stack:
        $ref: '#/$defs/domain_03_arquitetura_full_stack'
      domain_04_implementacao:
        $ref: '#/$defs/domain_04_implementacao'
      domain_05_operacao_deploy_rollback:
        $ref: '#/$defs/domain_05_operacao_deploy_rollback'
      domain_06_governanca_seguranca:
        $ref: '#/$defs/domain_06_governanca_seguranca'
      domain_07_documentacao_fundacional:
        $ref: '#/$defs/domain_07_documentacao_fundacional'
      domain_08_gestao_de_projetos_pmbok:
        $ref: '#/$defs/domain_08_gestao_de_projetos_pmbok'
      domain_09_planejamento_estrategico_tatico_e_operacional:
        $ref: '#/$defs/domain_09_planejamento_estrategico_tatico_e_operacional'
      domain_10_roadmap_cronograma_ciclos_e_backlog:
        $ref: '#/$defs/domain_10_roadmap_cronograma_ciclos_e_backlog'
      domain_11_editorial_campanhas_e_conteudo:
        $ref: '#/$defs/domain_11_editorial_campanhas_e_conteudo'
      domain_12_stakeholders:
        $ref: '#/$defs/domain_12_stakeholders'
      domain_13_runbooks_sops_e_rotinas:
        $ref: '#/$defs/domain_13_runbooks_sops_e_rotinas'
      domain_14_pesquisa_dados_e_conhecimento:
        $ref: '#/$defs/domain_14_pesquisa_dados_e_conhecimento'
      domain_15_skills_plugins_e_ferramentas:
        $ref: '#/$defs/domain_15_skills_plugins_e_ferramentas'
      domain_16_plataformas_contas_e_identificadores:
        $ref: '#/$defs/domain_16_plataformas_contas_e_identificadores'
      domain_17_prompt_engineering_comandos:
        $ref: '#/$defs/domain_17_prompt_engineering_comandos'
$defs:
  evidence_item:
    type: object
    additionalProperties: false
    required:
    - source_id
    - locator
    - support
    properties:
      source_id:
        type: string
        minLength: 1
        description: Identificador estável do documento no corpus.
      source_title:
        type:
        - string
        - 'null'
        description: Título/nome legível do documento, quando disponível.
      locator:
        type: string
        minLength: 1
        description: 'Localização reproduzível: página, seção, heading, linha, timestamp, URL/âncora ou caminho.'
      excerpt:
        type:
        - string
        - 'null'
        description: Trecho curto que sustenta a extração; não substituir o locator.
      support:
        type: string
        enum:
        - supports
        - contradicts
        - context
        description: Relação desta evidência com a resposta.
      source_date:
        type:
        - string
        - 'null'
        description: Data declarada pelo documento, preferencialmente ISO 8601.
      notes:
        type:
        - string
        - 'null'
  extracted_field:
    type: object
    additionalProperties: false
    required:
    - status
    - answer
    - confidence
    - evidence
    properties:
      status:
        type: string
        enum:
        - found
        - not_found
        - conflict
        - inferred
        description: found=explicitamente sustentado; not_found=ausente; conflict=fontes divergem; inferred=conclusão derivada,
          claramente marcada.
      answer:
        type:
        - string
        - 'null'
        description: Resposta pronta para a célula Resposta da planilha. Use texto conciso; listas podem ser multiline.
      confidence:
        type:
        - string
        - 'null'
        enum:
        - high
        - medium
        - low
        - null
      evidence:
        type: array
        items:
          $ref: '#/$defs/evidence_item'
        default: []
      conflict_summary:
        type:
        - string
        - 'null'
        description: Obrigatório quando status=conflict.
      notes:
        type:
        - string
        - 'null'
        description: Observações de extração; não usar para inventar resposta ausente.
    allOf:
    - if:
        properties:
          status:
            const: found
      then:
        properties:
          answer:
            type: string
            minLength: 1
          evidence:
            minItems: 1
    - if:
        properties:
          status:
            const: not_found
      then:
        properties:
          answer:
            const: null
          confidence:
            const: null
          evidence:
            maxItems: 0
    - if:
        properties:
          status:
            const: conflict
      then:
        properties:
          evidence:
            minItems: 2
          conflict_summary:
            type: string
            minLength: 1
    - if:
        properties:
          status:
            const: inferred
      then:
        properties:
          answer:
            type: string
            minLength: 1
          evidence:
            minItems: 1
  domain_01_negocio_gtm:
    type: object
    title: Domínio 1 — NEGÓCIO & GTM
    description: Por que o produto existe, para quem, e como se sustenta financeiramente
    additionalProperties: false
    required:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    - '1.10'
    - '1.11'
    - '1.12'
    properties:
      '1.1':
        $ref: '#/$defs/extracted_field'
        title: Problema central
        description: Descreva em 1 frase o problema que o produto resolve.
        x-field-id: '1.1'
        x-example: 'Ex: Equipes técnicas perdem contexto entre sessões de IA e retrabalham decisões já tomadas.'
        x-workbook-response-cell: 01_Formulario!E8
        x-output-sheet: 02_Visao_Geral
      '1.2':
        $ref: '#/$defs/extracted_field'
        title: Público-alvo / ICP
        description: Quem é o cliente ideal — perfil, tamanho, contexto de uso.
        x-field-id: '1.2'
        x-example: 'Ex: Founders técnicos solo ou squads pequenos construindo produtos com IA integrada.'
        x-workbook-response-cell: 01_Formulario!E9
        x-output-sheet: 02_Visao_Geral
      '1.3':
        $ref: '#/$defs/extracted_field'
        title: Proposta de valor
        description: O que torna esse produto a escolha óbvia frente a alternativas.
        x-field-id: '1.3'
        x-example: 'Ex: Único agente que mantém memória estruturada entre sessões sem configuração manual.'
        x-workbook-response-cell: 01_Formulario!E10
        x-output-sheet: 02_Visao_Geral
      '1.4':
        $ref: '#/$defs/extracted_field'
        title: Canais de aquisição
        description: Como novos usuários vão descobrir o produto (orgânico, paid, parcerias, comunidade).
        x-field-id: '1.4'
        x-example: 'Ex: Conteúdo técnico + comunidade de early adopters + parcerias com ferramentas complementares.'
        x-workbook-response-cell: 01_Formulario!E11
        x-output-sheet: 02_Visao_Geral
      '1.5':
        $ref: '#/$defs/extracted_field'
        title: Métrica North Star
        description: A métrica única que melhor representa sucesso do produto.
        x-field-id: '1.5'
        x-example: 'Ex: Número de sessões semanais com reuso de contexto salvo.'
        x-workbook-response-cell: 01_Formulario!E12
        x-output-sheet: 02_Visao_Geral
      '1.6':
        $ref: '#/$defs/extracted_field'
        title: Métricas guardrail
        description: Métricas que não podem degradar enquanto a North Star sobe.
        x-field-id: '1.6'
        x-example: 'Ex: Latência de resposta, taxa de erro em produção.'
        x-workbook-response-cell: 01_Formulario!E13
        x-output-sheet: 02_Visao_Geral
      '1.7':
        $ref: '#/$defs/extracted_field'
        title: CAC (custo de aquisição)
        description: Custo estimado para adquirir um cliente pagante.
        x-field-id: '1.7'
        x-example: 'Ex: A definir após primeiro ciclo de aquisição paga.'
        x-workbook-response-cell: 01_Formulario!E14
        x-output-sheet: 02_Visao_Geral
      '1.8':
        $ref: '#/$defs/extracted_field'
        title: LTV (valor do tempo de vida)
        description: Valor estimado que um cliente gera ao longo do relacionamento.
        x-field-id: '1.8'
        x-example: 'Ex: A definir com base em churn projetado.'
        x-workbook-response-cell: 01_Formulario!E15
        x-output-sheet: 02_Visao_Geral
      '1.9':
        $ref: '#/$defs/extracted_field'
        title: Margem por unidade/usuário
        description: Custo variável (infra, API/tokens) por usuário ativo vs. receita.
        x-field-id: '1.9'
        x-example: 'Ex: Custo de API de IA por usuário/mês vs. preço do plano.'
        x-workbook-response-cell: 01_Formulario!E16
        x-output-sheet: 02_Visao_Geral
      '1.10':
        $ref: '#/$defs/extracted_field'
        title: Ponto de equilíbrio (breakeven)
        description: Quantos clientes/receita necessários para cobrir custos fixos.
        x-field-id: '1.10'
        x-example: 'Ex: N clientes no plano X cobrem a infraestrutura base mensal.'
        x-workbook-response-cell: 01_Formulario!E17
        x-output-sheet: 02_Visao_Geral
      '1.11':
        $ref: '#/$defs/extracted_field'
        title: Teto de gasto de infraestrutura
        description: Limite mensal aprovado por serviço (hosting, banco, API de IA).
        x-field-id: '1.11'
        x-example: 'Ex: Vercel $X, Supabase $X, Anthropic API $X — tetos configurados no console de cada provedor.'
        x-workbook-response-cell: 01_Formulario!E18
        x-output-sheet: 02_Visao_Geral
      '1.12':
        $ref: '#/$defs/extracted_field'
        title: Gatilhos de upgrade de infra
        description: Condição objetiva que dispara upgrade de plano/tier.
        x-field-id: '1.12'
        x-example: 'Ex: Uso de API acima de 80% do teto por 3 dias consecutivos.'
        x-workbook-response-cell: 01_Formulario!E19
        x-output-sheet: 02_Visao_Geral
    x-domain-number: 1
    x-domain-title: NEGÓCIO & GTM
    x-field-count: 12
    x-output-sheet: 02_Visao_Geral
